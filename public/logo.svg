<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Black Circular Badge Background -->
  <circle cx="50" cy="50" r="49" fill="#000000" stroke="#222226" stroke-width="1.5" />
  
  <!-- Outer Concentric White Ring -->
  <circle cx="50" cy="50" r="37.5" stroke="#FFFFFF" stroke-width="4.8" fill="none" />
  
  <!-- Middle Dark Space between rings -->
  
  <!-- Inner Concentric White Ring -->
  <circle cx="50" cy="50" r="27.5" stroke="#FFFFFF" stroke-width="4.8" fill="none" />
  
  <!-- Center Stylized Musical Note -->
  <!-- Note Head (Hollow circle outline) -->
  <circle cx="45" cy="56.5" r="7.2" stroke="#FFFFFF" stroke-width="3.2" fill="none" />
  
  <!-- Note Stem (Vertical bar extending upwards) -->
  <path d="M52.2 56.5 V 30" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
  
  <!-- Flag / Beam curving rightwards following concentric flow -->
  <path d="M52.2 30 C 59 30, 66.5 35, 66.5 43" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none" />
  
  <!-- Concentric Inner Arc surrounding note head (echoing soundwaves) -->
  <path d="M43 37 C 35 41, 32.5 49, 34 57" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <path d="M57.5 43 C 60.5 47, 60.5 52, 58 56" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none" />
</svg>
